<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Payment - MistalOnline</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html,
        body {
            height: 100%;
            overflow: hidden;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0a0a;
            background-image: radial-gradient(ellipse at 30% 20%, #1a0a2e 0%, #0a0a0a 70%);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 4px;
            height: 100vh;
            overflow: hidden;
        }

        .payment-container {
            max-width: 580px;
            width: 100%;
            height: 100vh;
            max-height: 820px;
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 215, 0, 0.08);
            border-radius: 32px;
            padding: 10px 18px 8px 18px;
            box-shadow: 0 30px 70px rgba(0, 0, 0, 0.6);
            transition: 0.4s ease;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        .payment-container.success-mode {
            border-color: rgba(46, 213, 115, 0.35);
            box-shadow: 0 0 60px rgba(46, 213, 115, 0.08), 0 30px 70px rgba(0, 0, 0, 0.6);
        }
        .payment-container.success-mode::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at center, rgba(46, 213, 115, 0.04), transparent 60%);
            animation: glowPulse 3s ease-in-out infinite;
            pointer-events: none;
        }
        @keyframes glowPulse {
            0%,
            100% {
                opacity: 0.3;
                transform: scale(1);
            }
            50% {
                opacity: 0.7;
                transform: scale(1.04);
            }
        }

        .screen {
            display: none;
            flex-direction: column;
            height: 100%;
            flex: 1;
            position: relative;
            z-index: 2;
        }
        .screen.active {
            display: flex;
        }

        /* 🔥 BACK BUTTON - SIRF EK, BADA */
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: rgba(255, 255, 255, 0.3);
            text-decoration: none;
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 2px;
            transition: 0.3s;
            flex-shrink: 0;
            padding: 6px 12px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            width: fit-content;
        }
        .back-link:hover {
            color: #f9d423;
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(249, 212, 35, 0.15);
        }
        .back-link svg {
            width: 18px;
            height: 18px;
            stroke: currentColor;
        }

        .payment-header {
            text-align: center;
            margin-bottom: 2px;
            flex-shrink: 0;
        }
        .payment-header h2 {
            font-size: 22px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 0.5px;
        }
        .payment-header p {
            color: rgba(255, 255, 255, 0.15);
            font-size: 11px;
            margin-top: 0px;
            letter-spacing: 1px;
        }

        .instructions {
            background: rgba(46, 213, 115, 0.04);
            border: 1px solid rgba(46, 213, 115, 0.06);
            border-radius: 12px;
            padding: 6px 14px;
            margin-bottom: 3px;
            flex-shrink: 0;
            order: -1;
        }
        .instructions .inst-title {
            color: #2ed573;
            font-weight: 700;
            font-size: 15px;
            margin-bottom: 2px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .instructions .inst-title svg {
            width: 17px;
            height: 17px;
            stroke: #2ed573;
        }
        .instructions .inst-step {
            color: rgba(255, 255, 255, 0.7);
            font-size: 14px;
            font-weight: 500;
            padding: 1px 0;
            padding-left: 20px;
            position: relative;
            line-height: 1.6;
        }
        .instructions .inst-step::before {
            content: '';
            position: absolute;
            left: 4px;
            top: 8px;
            width: 6px;
            height: 6px;
            background: #f9d423;
            border-radius: 50%;
        }
        .instructions .inst-step strong {
            color: #f9d423;
            font-weight: 700;
            font-size: 16px;
        }

        /* 🔥 AMOUNT - "₹" aur "पैसे" ke saath */
        .amount-display-box {
            text-align: center;
            padding: 8px 12px;
            background: rgba(249, 212, 35, 0.04);
            border: 1px solid rgba(249, 212, 35, 0.06);
            border-radius: 12px;
            margin-bottom: 3px;
            flex-shrink: 0;
        }
        .amount-display-box .amount-label {
            color: rgba(255, 255, 255, 0.4);
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 2px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-weight: 600;
        }
        .amount-display-box .amount-label svg {
            width: 17px;
            height: 17px;
            stroke: rgba(255, 255, 255, 0.4);
        }
        .amount-display-box .amount-value {
            color: #f9d423;
            font-size: 36px;
            font-weight: 900;
            display: block;
            margin-top: 0px;
            letter-spacing: 2px;
        }
        .amount-display-box .amount-currency {
            color: rgba(255, 255, 255, 0.2);
            font-size: 14px;
            font-weight: 500;
            margin-top: -2px;
        }

        .qr-amount {
            text-align: center;
            padding: 3px 0;
            flex-shrink: 0;
            margin-bottom: 2px;
        }
        .qr-amount .qr-pay-text {
            color: rgba(255, 255, 255, 0.7);
            font-size: 17px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        .qr-amount .qr-pay-text strong {
            color: #f9d423;
            font-size: 21px;
            font-weight: 900;
        }

        /* QR CODE - BADA */
        .qr-container {
            text-align: center;
            padding: 6px;
            background: rgba(255, 255, 255, 0.02);
            border: 2px solid rgba(255, 215, 0, 0.05);
            border-radius: 14px;
            margin-bottom: 4px;
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 0;
            cursor: pointer;
            transition: 0.3s;
        }
        .qr-container:hover {
            border-color: rgba(249, 212, 35, 0.15);
        }
        .qr-container .qr-label {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            color: rgba(255, 255, 255, 0.15);
            font-size: 12px;
            margin-bottom: 2px;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 600;
        }
        .qr-container .qr-label svg {
            width: 16px;
            height: 16px;
            stroke: rgba(255, 255, 255, 0.15);
        }
        .qr-container img {
            width: 100%;
            max-width: 340px;
            height: auto;
            aspect-ratio: 1/1;
            border-radius: 12px;
            display: block;
            background: white;
            padding: 8px;
            object-fit: contain;
        }

        .btn-row {
            display: flex;
            gap: 10px;
            flex-shrink: 0;
            margin-bottom: 1px;
        }
        .btn-row .btn-half {
            flex: 1;
            padding: 16px 10px;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            border: none;
            letter-spacing: 0.5px;
        }
        .btn-row .btn-half svg {
            width: 22px;
            height: 22px;
            stroke-width: 2;
        }

        .btn-download {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08) !important;
            color: rgba(255, 255, 255, 0.6);
        }
        .btn-download:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
        }

        .btn-submit {
            background: linear-gradient(135deg, #f9d423, #f7971e);
            color: #0a0a0a;
        }
        .btn-submit svg {
            stroke: #0a0a0a;
        }
        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 40px rgba(249, 212, 35, 0.2);
        }

        #statusMsg {
            text-align: center;
            margin-top: 2px;
            color: rgba(255, 255, 255, 0.2);
            font-size: 13px;
            min-height: 20px;
            flex-shrink: 0;
            font-weight: 500;
        }
        #statusMsg.success {
            color: #2ed573;
        }
        #statusMsg.error {
            color: #ff4757;
        }
        #statusMsg.warning {
            color: #f9d423;
        }

        /* ============================================================ */
        /* SCREEN 2 - ORDER SUCCESS */
        /* ============================================================ */
        .success-screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            align-items: center;
            justify-content: center;
            padding: 10px 0;
        }

        .success-icon {
            text-align: center;
            font-size: 0;
            margin-bottom: 6px;
            flex-shrink: 0;
        }
        .success-icon .check {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: rgba(46, 213, 115, 0.08);
            padding: 16px 20px;
            border-radius: 50%;
            border: 3px solid rgba(46, 213, 115, 0.15);
            animation: pulse 2s ease-in-out infinite;
        }
        .success-icon .check svg {
            width: 56px;
            height: 56px;
            stroke: #2ed573;
            stroke-width: 2.5;
            fill: none;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.05); opacity: 0.9; }
        }

        .order-header {
            text-align: center;
            margin-bottom: 8px;
            flex-shrink: 0;
        }
        .order-header h2 {
            font-size: 28px;
            font-weight: 800;
            color: #2ed573;
            letter-spacing: 0.5px;
            text-shadow: 0 0 30px rgba(46, 213, 115, 0.1);
        }
        .order-header p {
            color: rgba(255, 255, 255, 0.25);
            font-size: 14px;
            margin-top: 2px;
        }

        .order-details-box {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 14px;
            padding: 12px 18px;
            width: 100%;
            flex: 1;
            overflow-y: auto;
            margin-bottom: 6px;
        }
        .order-details-box::-webkit-scrollbar {
            width: 3px;
        }
        .order-details-box::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            padding: 7px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
        }
        .detail-row:last-child {
            border-bottom: none;
        }
        .detail-label {
            color: rgba(255, 255, 255, 0.4);
            font-size: 13px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .detail-label svg {
            width: 16px;
            height: 16px;
            stroke: rgba(255, 255, 255, 0.3);
            fill: none;
            stroke-width: 2;
        }
        .detail-value {
            color: #ffffff;
            font-size: 14px;
            font-weight: 600;
            text-align: right;
            max-width: 60%;
            word-break: break-all;
        }
        .detail-value.amount {
            color: #f9d423;
            font-size: 20px;
            font-weight: 900;
        }
        .detail-value.status {
            color: #2ed573;
        }

        .btn-row-success {
            display: flex;
            gap: 10px;
            flex-shrink: 0;
            width: 100%;
        }
        .btn-row-success .btn-success {
            flex: 1;
            padding: 16px 10px;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            border: none;
            letter-spacing: 0.5px;
            text-decoration: none;
        }
        .btn-row-success .btn-success svg {
            width: 22px;
            height: 22px;
            stroke-width: 2;
            fill: none;
        }

        .btn-download-order {
            background: linear-gradient(135deg, #f9d423, #f7971e);
            color: #0a0a0a;
        }
        .btn-download-order svg {
            stroke: #0a0a0a;
        }
        .btn-download-order:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 40px rgba(249, 212, 35, 0.2);
        }

        .btn-home {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08) !important;
            color: rgba(255, 255, 255, 0.6);
        }
        .btn-home svg {
            stroke: rgba(255, 255, 255, 0.6);
        }
        .btn-home:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
        }
        .btn-home:hover svg {
            stroke: #ffffff;
        }

        @media (max-width: 480px) {
            .payment-container {
                padding: 8px 12px 6px 12px;
                max-height: 720px;
                border-radius: 24px;
            }
            .qr-container img {
                max-width: 280px;
            }
            .payment-header h2 {
                font-size: 19px;
            }
            .amount-display-box .amount-value {
                font-size: 30px;
            }
            .order-header h2 {
                font-size: 22px;
            }
            .success-icon .check svg {
                width: 44px;
                height: 44px;
            }
            .back-link {
                font-size: 14px;
                padding: 4px 10px;
            }
            .btn-row-success .btn-success {
                font-size: 13px;
                padding: 14px 8px;
            }
        }
        @media (max-height: 600px) {
            .payment-container {
                padding: 4px 10px 4px 10px;
                max-height: 580px;
                border-radius: 20px;
            }
            .qr-container img {
                max-width: 200px;
            }
            .qr-container {
                padding: 3px;
            }
            .instructions {
                padding: 3px 10px;
            }
            .instructions .inst-step {
                font-size: 12px;
                padding: 1px 0 1px 16px;
                line-height: 1.4;
            }
            .instructions .inst-step::before {
                top: 6px;
                width: 5px;
                height: 5px;
            }
            .instructions .inst-title {
                font-size: 13px;
            }
            .amount-display-box {
                padding: 3px 8px;
                margin-bottom: 2px;
            }
            .amount-display-box .amount-value {
                font-size: 24px;
            }
            .amount-display-box .amount-label {
                font-size: 11px;
            }
            .qr-amount .qr-pay-text {
                font-size: 13px;
            }
            .qr-amount .qr-pay-text strong {
                font-size: 15px;
            }
            .btn-row .btn-half {
                font-size: 12px;
                padding: 10px 6px;
                border-radius: 10px;
            }
            .btn-row .btn-half svg {
                width: 18px;
                height: 18px;
            }
            .payment-header h2 {
                font-size: 16px;
            }
            .payment-header p {
                font-size: 10px;
            }
            .order-details-box {
                padding: 4px 10px;
            }
            .detail-row {
                padding: 3px 0;
            }
            .detail-label {
                font-size: 11px;
            }
            .detail-value {
                font-size: 12px;
            }
            .detail-value.amount {
                font-size: 16px;
            }
            .order-header h2 {
                font-size: 18px;
            }
            .order-header p {
                font-size: 11px;
            }
            .success-icon .check {
                padding: 6px 10px;
            }
            .success-icon .check svg {
                width: 32px;
                height: 32px;
            }
            .btn-row-success .btn-success {
                font-size: 12px;
                padding: 10px 6px;
                border-radius: 10px;
            }
            .btn-row-success .btn-success svg {
                width: 18px;
                height: 18px;
            }
            #statusMsg {
                font-size: 11px;
                min-height: 16px;
            }
            .back-link {
                font-size: 13px;
                padding: 3px 8px;
            }
            .back-link svg {
                width: 16px;
                height: 16px;
            }
        }
    </style>
</head>
<body>

        <!-- ========================================================== -->
        <!-- SCREEN 1: PAYMENT -->
        <!-- ========================================================== -->
