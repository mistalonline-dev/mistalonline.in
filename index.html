<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Simple Website</title>
    <style>
        /* Global Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            background: white;
            border-radius: 20px;
            padding: 50px 40px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
            animation: fadeIn 1s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .profile-img {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 70px;
            color: white;
            font-weight: bold;
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
        }

        h1 {
            font-size: 32px;
            color: #2d3748;
            margin-bottom: 5px;
        }

        .subtitle {
            color: #667eea;
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 15px;
        }

        .bio {
            color: #4a5568;
            font-size: 16px;
            line-height: 1.8;
            margin-bottom: 25px;
        }

        .divider {
            width: 60px;
            height: 4px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0 auto 25px;
            border-radius: 2px;
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 25px;
        }

        .social-links a {
            text-decoration: none;
            color: #2d3748;
            background: #f7fafc;
            padding: 10px 20px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
            border: 2px solid transparent;
        }

        .social-links a:hover {
            background: #667eea;
            color: white;
            border-color: #667eea;
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.3);
        }

        .btn {
            display: inline-block;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 14px 40px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 600;
            font-size: 16px;
            transition: all 0.3s ease;
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
            border: none;
            cursor: pointer;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 35px rgba(102, 126, 234, 0.5);
        }

        .footer {
            margin-top: 25px;
            color: #a0aec0;
            font-size: 13px;
        }

        /* Responsive */
        @media (max-width: 480px) {
            .card {
                padding: 30px 20px;
            }

            h1 {
                font-size: 26px;
            }

            .profile-img {
                width: 120px;
                height: 120px;
                font-size: 50px;
            }

            .social-links a {
                padding: 8px 16px;
                font-size: 13px;
            }
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- Profile Image (Initials) -->
        <div class="profile-img">👤</div>

        <!-- Name -->
        <h1>Your Name</h1>
        <p class="subtitle">Web Developer | Designer</p>

        <div class="divider"></div>

        <!-- Bio -->
        <p class="bio">
            Hello! I'm a passionate web developer creating beautiful and functional
            websites. This is my simple portfolio page hosted on GitHub Pages.
        </p>

        <!-- Social Links -->
        <div class="social-links">
            <a href="#" target="_blank">🐦 Twitter</a>
            <a href="#" target="_blank">💻 GitHub</a>
            <a href="#" target="_blank">🔗 LinkedIn</a>
            <a href="#" target="_blank">📧 Email</a>
        </div>

        <!-- Call to Action Button -->
        <a href="#" class="btn">View My Work</a>

        <div class="footer">
            © 2026 Your Name. All rights reserved.
        </div>
    </div>

</body>
</html>
